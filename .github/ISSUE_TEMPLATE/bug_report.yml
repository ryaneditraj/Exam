name: Bug report
description: Something in Exam Strategy Studio does not behave as it should
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Leave out questions from a real paper if they are private, and do not paste secrets or the contents of `.env`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run python app.py
        2. Open http://127.0.0.1:5001
        3. Save a question with these marks
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04"
    validations:
      required: false
